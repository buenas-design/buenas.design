<script>
// opens the proposal with the key in the link (after the "#"); the key never leaves the browser
(async () => {
  const $ = (id) => document.getElementById(id);
  const bytes = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/').padEnd(Math.ceil(s.length / 4) * 4, '=')), (c) => c.charCodeAt(0));
  try {
    const sealed = JSON.parse($('p-sealed').textContent || 'null');
    const word = decodeURIComponent(location.hash.slice(1));
    if (!sealed || !word) throw new Error('no key');
    const key = await crypto.subtle.importKey('raw', bytes(word), 'AES-GCM', false, ['decrypt']);
    const p = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(sealed.iv) }, key, bytes(sealed.data))));
    // swap the whole lock page for the proposal
    const doc = new DOMParser().parseFromString(p.html, 'text/html');
    document.replaceChild(document.importNode(doc.documentElement, true), document.documentElement);
    // parsed scripts never run on their own: recreate each one so the proposal's own scripts (e.g. scroll fade-ins) run
    for (const old of document.querySelectorAll('script')) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    }
  } catch (e) {
    $('p-title').textContent = $('p-title').dataset.locked;
    $('p-locked').hidden = false;
  }
})();
</script>
